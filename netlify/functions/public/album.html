<script src="/js/main.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  var params = new URLSearchParams(window.location.search);
  var albumId = params.get('id');
  var titleEl = document.getElementById('albumTitle');
  var dateEl = document.getElementById('albumDate');
  var heroEl = document.getElementById('albumHero');
  var gridEl = document.getElementById('photoGrid');
  var stateEl = document.getElementById('stateMsg');
  var gateEl = document.getElementById('lockGate');
  var errorEl = document.getElementById('lockError');

  function showState(msg) {
    stateEl.style.display = 'block';
    stateEl.textContent = msg;
  }

  function loadAlbum(password) {
    if (!albumId) {
      titleEl.textContent = 'Album not found';
      showState('No album was specified.');
      return;
    }
    var url = '/api/album-photos?id=' + encodeURIComponent(albumId) + (password ? '&password=' + encodeURIComponent(password) : '');
    fetch(url).then(function (r) {
      if (r.status === 401) {
        gateEl.style.display = 'block';
        titleEl.textContent = 'Protected Album';
        if (password) errorEl.style.display = 'block';
        return null;
      }
      return r.json();
    }).then(function (data) {
      if (!data) return;
      gateEl.style.display = 'none';
      titleEl.textContent = data.title || 'Album';
      if (data.banner) heroEl.style.backgroundImage = 'linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.45)), url(' + data.banner + ')';
      if (data.date) { dateEl.textContent = data.date; dateEl.style.display = 'block'; }
      if (!data.photos || !data.photos.length) {
        showState('No photos in this album yet.');
        return;
      }
      gridEl.innerHTML = data.photos.map(function (p) {
        return '<a href="' + p.full + '" target="_blank" rel="noopener"><img src="' + p.thumb + '" alt="' + p.name + '" loading="lazy"></a>';
      }).join('');
    }).catch(function () {
      showState('Couldn\'t load this album right now.');
    });
  }

  document.getElementById('unlockBtn').addEventListener('click', function () {
    errorEl.style.display = 'none';
    loadAlbum(document.getElementById('albumPassword').value);
  });
  document.getElementById('albumPassword').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('unlockBtn').click();
  });

  loadAlbum();
</script>

</body>
