<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematography — Framez</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="site">
  <nav class="bar wrap">
    <a href="/" class="logo"><img src="/assets/logo.svg" alt="Framez" class="logo-img"></a>
    <button class="navtoggle" id="navToggle" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    <div class="navlinks" id="navLinks">
      <a href="/">Home</a>
      <a href="/about.html">About</a>
      <a href="/portfolio.html">Portfolio</a>
      <a href="/gallery.html">Gallery</a>
      <a href="/videos.html" class="active">Cinematography</a>
      <a href="/contact.html">Contact</a>
    </div>
  </nav>
</header>

<section class="hero" style="padding-bottom:60px;">
  <div class="wrap">
    <div class="eyebrow">AFTER MOVIES &amp; HIGHLIGHT REELS</div>
    <h1 class="serif" style="font-size:clamp(32px,5vw,52px);">Video Albums</h1>
  </div>
</section>

<section style="padding-top:0;">
  <div class="wrap">
    <div class="album-grid" id="videoGrid">
      <p class="state-msg">Loading video albums…</p>
    </div>
  </div>
</section>

<footer class="site wrap">
  <span>&copy; <span id="year"></span> Framez. All rights reserved.</span>
  <span>Based in Sri Lanka</span>
</footer>

<script src="/js/main.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  fetch('/api/videos')
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var el = document.getElementById('videoGrid');
      if (!data.albums || !data.albums.length) {
        el.innerHTML = '<p class="state-msg">No video albums yet — create a folder inside "Framez Videos" in Drive with a _meta.json file.</p>';
        return;
      }
      el.innerHTML = data.albums.map(function (a) {
        return (
          '<a class="album-tile" href="/video-album.html?id=' + a.id + '">' +
            '<div class="album-thumb">' +
              '<span class="placeholder">' + a.count + (a.count === 1 ? ' video' : ' videos') + '</span>' +
              (a.locked ? '<span class="lock-badge">LOCKED</span>' : '') +
            '</div>' +
            '<div class="album-meta"><h4 class="serif">' + a.title + '</h4></div>' +
          '</a>'
        );
      }).join('');
    })
    .catch(function () {
      document.getElementById('videoGrid').innerHTML = '<p class="state-msg">Couldn\'t load video albums right now.</p>';
    });
</script>

</body>
</html>
